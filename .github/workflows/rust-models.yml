name: Rust and neural model checks
on:
  push:
    branches: [main]
    paths:
      - 'experiments/drumsrnn/**'
      - '.github/workflows/rust-models.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Install audio build dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Test Rust including live audio compilation
        run: cargo test --release --locked --manifest-path experiments/drumsrnn/rust/Cargo.toml --features live-audio
      - name: Download and inspect selected neural checkpoints
        run: |
          for model in drum_kit_rnn melody_rnn multitrack_chords; do
            bash experiments/drumsrnn/download-model.sh "$model"
          done
      - name: Install isolated browser oracle
        run: |
          npm install --prefix "$RUNNER_TEMP/neural-check" playwright@1.48.2
          "$RUNNER_TEMP/neural-check/node_modules/.bin/playwright" install --with-deps chromium
      - name: Generate official Magenta.js reference
        env:
          NEURAL_CHECK_TOOLS: ${{ runner.temp }}/neural-check
          NEURAL_REFERENCE: ${{ runner.temp }}/neural-reference.json
        run: node experiments/drumsrnn/check-neural-reference.mjs
      - name: Verify native inference and sampled phrases
        run: cargo run --release --locked --manifest-path experiments/drumsrnn/rust/Cargo.toml --bin neural-check -- experiments/drumsrnn/models "$RUNNER_TEMP/neural-reference.json"
