name: Publish Y2Synth UI Lab (480x360)

on:
  push:
    branches: [main]
    paths:
      - 'experiments/ui-prototype/**'
      - '.github/workflows/pages-ui.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: y2synth-ui-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Validate native 480x360 UI and JavaScript
        run: |
          node experiments/ui-prototype/check-ui.mjs
          node experiments/ui-prototype/check-stream.mjs
          node experiments/ui-prototype/check-nano.mjs

      - name: Install Chromium test runner
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Verify ambient Magenta generation and continuous playback
        run: node experiments/ui-prototype/check-ambient-browser.mjs

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nanomaestro-pages-browser
          path: nano-browser-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Assemble static Pages site
        run: |
          mkdir -p _site
          cp experiments/ui-prototype/index.html experiments/ui-prototype/neural-common.js experiments/ui-prototype/neural-worker.js experiments/ui-prototype/ambient*.js _site/
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Y2Synth UI site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
