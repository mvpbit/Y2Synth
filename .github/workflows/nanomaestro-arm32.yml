name: NanoMaestro Light ARM32 feasibility

on:
  push:
    branches: [main]
    paths:
      - 'experiments/nanomaestro-arm32/**'
      - '.github/workflows/nanomaestro-arm32.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nanomaestro-arm32
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-22.04
    container: debian:trixie-slim
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v6
      - name: Install Debian CPU reference and ARM32 runtime
        run: |
          dpkg --add-architecture armhf
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates \
            python3 python3-numpy python3-onnx python3-onnxruntime \
            g++-arm-linux-gnueabihf libonnxruntime-dev:armhf qemu-user file
          mkdir -p nano-results
          dpkg-query -W > nano-results/debian-packages.txt
      - name: Inspect pinned model and run x86 oracle
        run: python3 experiments/nanomaestro-arm32/prepare_reference.py
      - name: Build standalone Cortex-A7 probe
        run: |
          set -o pipefail
          arm-linux-gnueabihf-g++ -std=c++17 -O2 -mcpu=cortex-a7 -mfpu=neon-vfpv4 -mfloat-abi=hard \
            experiments/nanomaestro-arm32/probe.cpp \
            -I /usr/include/onnxruntime \
            -L /usr/lib/arm-linux-gnueabihf -lonnxruntime \
            -o nano-results/nanomaestro-arm32 2>&1 | tee nano-results/arm32-build.log
          file nano-results/nanomaestro-arm32 > nano-results/elf.txt
          arm-linux-gnueabihf-readelf -A nano-results/nanomaestro-arm32 >> nano-results/elf.txt
          arm-linux-gnueabihf-readelf --version-info nano-results/nanomaestro-arm32 > nano-results/abi.txt
      - name: Execute Cortex-A7 oracle and stateful generation
        run: |
          set -o pipefail
          timeout 600 qemu-arm -cpu cortex-a7 -L /usr/arm-linux-gnueabihf \
            -E LD_LIBRARY_PATH=/usr/lib/arm-linux-gnueabihf \
            nano-results/nanomaestro-arm32 nano-model/model.onnx nano-results \
            2>&1 | tee nano-results/arm32-run.log
      - name: Summarize evidence
        if: always()
        run: |
          if test -f nano-results/manifest.json; then
            python3 experiments/nanomaestro-arm32/summarize.py
          fi
      - name: Upload reports only (no model weights)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nanomaestro-arm32-evidence
          path: |
            nano-results/*.json
            nano-results/*.md
            nano-results/*.txt
            nano-results/*.log
            nano-results/*.config
          retention-days: 14
